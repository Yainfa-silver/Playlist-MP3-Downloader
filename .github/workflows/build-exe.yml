name: Compilar EXE

on:
  workflow_dispatch:        # Botón "Run workflow" en GitHub
  push:
    branches: [ main ]

permissions:
  contents: write           # Para crear las Releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pystray pillow pyinstaller

      - name: Compilar el .exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name "PlaylistMP3Downloader" `
            --add-data "templates;templates" `
            --hidden-import "pystray._win32" `
            main.py

      - name: VERIFICAR que el .exe contiene Formato y Calidad
        run: |
          python - <<'PY'
          import glob, zipfile, os, subprocess, sys
          # Listamos el contenido del .exe (CArchive) y extraemos la plantilla
          from pathlib import Path
          exe = Path("dist/PlaylistMP3Downloader.exe")
          out = Path("_check")
          out.mkdir(exist_ok=True)
          cmd = [sys.executable, "-m", "PyInstaller.utils.cliutils.archive_viewer", "-l", str(exe)]
          listing = subprocess.run(cmd, capture_output=True, text=True).stdout
          print(listing[-2000:])
          assert "templates\\index.html" in listing, "La plantilla index.html NO esta dentro del .exe"
          # Extraemos la plantilla
          with open("_cmds.txt", "w") as f:
              f.write("x\ntemplates\\index.html\n_check\\index_extracted.html\nq\n")
          with open("_cmds.txt") as f:
              r = subprocess.run([sys.executable, "-m", "PyInstaller.utils.cliutils.archive_viewer", str(exe)],
                                 stdin=f, capture_output=True, text=True)
          html = Path("_check/index_extracted.html").read_text(encoding="utf-8", errors="replace")
          checks = {
              "Formato": "Calidad de audio" in html,
              "MP4": "MP4 (video)" in html,
              "version": "v2.0" in html,
          }
          print("VERIFICACION:", checks)
          assert all(checks.values()), "FALLO: el .exe no incluye las opciones esperadas"
          print("OK: el .exe contiene Formato, Calidad de audio y version v2.0")
          PY

      - name: Subir el .exe generado
        uses: actions/upload-artifact@v4
        with:
          name: PlaylistMP3Downloader
          path: dist/PlaylistMP3Downloader.exe

      - name: Crear Release con enlace directo
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0-$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag "dist/PlaylistMP3Downloader.exe" --title "PlaylistMP3Downloader $tag" --notes "Descarga el .exe y ejecutalo. La primera vez descarga yt-dlp y ffmpeg automaticamente." --repo ${{ github.repository }}
        shell: pwsh